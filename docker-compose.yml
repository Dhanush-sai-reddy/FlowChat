version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - klymoo-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - klymoo-network

  fastapi-service:
    build: ./fastapi-service
    ports:
      - "8001:8000"
    networks:
      - klymoo-network

  node-backend:
    build: ./node-backend
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
      - FASTAPI_URL=http://fastapi-service:8000
      - MONGO_URI=mongodb://mongo:27017/klymo
    depends_on:
      - redis
      - mongo
      - fastapi-service
    networks:
      - klymoo-network

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - node-backend
    networks:
      - klymoo-network

networks:
  klymoo-network:
    driver: bridge

volumes:
  mongo_data:
